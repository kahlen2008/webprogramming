<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>HW: Contact Form — Week 8_1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #090d16;
            --card-bg: rgba(18, 24, 38, 0.9);
            --border: rgba(255, 255, 255, 0.09);
            --blue: #3b82f6;
            --blue-glow: rgba(59, 130, 246, 0.3);
            --green: #10b981;
            --red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --text-dim: #64748b;
            --radius-card: 20px;
            --radius-btn: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 20%, rgba(59, 130, 246, 0.12) 0%, transparent 45%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 20px 60px 20px;
        }

        .topbar {
            width: 100%;
            max-width: 520px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: var(--radius-btn);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .back-link:hover {
            color: #ffffff;
            border-color: var(--blue);
            background: rgba(59, 130, 246, 0.15);
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #34d399;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 36px 32px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.85rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .card-subtitle {
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-bottom: 22px;
            line-height: 1.5;
            text-wrap: pretty;
        }


        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
        }

        .req {
            color: #f87171;
            font-size: 12px;
        }

        input, textarea {
            width: 100%;
            padding: 11px 14px;
            font-size: 14px;
            border: 2px solid #334155;
            background: rgba(15, 23, 42, 0.6);
            color: #f8fafc;
            border-radius: 8px;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        /* Validation Pseudo-classes */
        input:not(:placeholder-shown):valid,
        textarea:not(:placeholder-shown):valid {
            border-color: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }

        input:not(:placeholder-shown):invalid,
        textarea:not(:placeholder-shown):invalid {
            border-color: #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.2);
        }

        input:focus, textarea:focus {
            border-color: #3b82f6;
            outline: 2px solid rgba(59, 130, 246, 0.4);
            outline-offset: 1px;
            background: rgba(15, 23, 42, 0.9);
        }

        .field-hint {
            font-size: 0.76rem;
            color: var(--text-dim);
        }

        button[type="submit"] {
            margin-top: 10px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            border: none;
            padding: 13px 24px;
            border-radius: var(--radius-btn);
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(16, 185, 129, 0.5);
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
        }

        .toast-msg {
            display: none;
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: 10px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #34d399;
            font-size: 0.92rem;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="topbar">
        <a href="index.html" class="back-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Week 8_1
        </a>
        <span class="badge">Homework Assignment</span>
    </div>

    <div class="card">
        <h2>Get in Touch</h2>
        <p class="card-subtitle">Personal site contact form with HTML5 validation and dynamic :valid/:invalid CSS feedback states.</p>

        <form method="post" action="#" onsubmit="event.preventDefault(); showSuccess();">
            <div class="field">
                <label for="name">Your Name <span class="req">*</span></label>
                <input type="text" id="name" name="name" required minlength="2" placeholder="e.g. Hong Gildong">
                <div class="field-hint">Minimum 2 characters</div>
            </div>

            <div class="field">
                <label for="email">Email Address <span class="req">*</span></label>
                <input type="email" id="email" name="email" required placeholder="name@example.com">
                <div class="field-hint">Valid email format required</div>
            </div>

            <div class="field">
                <label for="subject">Subject <span class="req">*</span></label>
                <input type="text" id="subject" name="subject" required minlength="3" placeholder="Subject of inquiry">
                <div class="field-hint">Minimum 3 characters</div>
            </div>

            <div class="field">
                <label for="message">Message <span class="req">*</span></label>
                <textarea id="message" name="message" required minlength="10" rows="4" placeholder="Write your message here..."></textarea>
                <div class="field-hint">Minimum 10 characters</div>
            </div>

            <button type="submit">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                Send Message
            </button>
        </form>

        <div id="toast" class="toast-msg">
            ✓ Message sent successfully! All fields validated.
        </div>
    </div>

    <script>
        function showSuccess() {
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3500);
        }
    </script>

</body>
</html>
