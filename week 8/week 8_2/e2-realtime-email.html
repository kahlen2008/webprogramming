<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>E2: Real-time Email Validation — Week 8_2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #090d16;
            --card-bg: rgba(18, 24, 38, 0.9);
            --border: rgba(255, 255, 255, 0.09);
            --blue: #3b82f6;
            --green: #10b981;
            --red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --text-dim: #64748b;
            --radius-card: 20px;
            --radius-btn: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(168, 85, 247, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 20%, rgba(59, 130, 246, 0.12) 0%, transparent 45%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 20px 60px 20px;
        }

        .topbar {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: var(--radius-btn);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .back-link:hover {
            color: #ffffff;
            border-color: var(--blue);
            background: rgba(59, 130, 246, 0.15);
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #c084fc;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 34px 30px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .card-subtitle {
            color: var(--text-sub);
            font-size: 0.88rem;
            margin-bottom: 22px;
            line-height: 1.5;
            text-wrap: pretty;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #334155;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            font-size: 14px;
            color: #f8fafc;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        /* Valid and Invalid CSS classes dynamically controlled by JS */
        input.valid-ok {
            border-color: #10b981 !important;
            background: rgba(16, 185, 129, 0.08) !important;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.25) !important;
        }

        input.valid-err {
            border-color: #ef4444 !important;
            background: rgba(239, 68, 68, 0.08) !important;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.25) !important;
        }

        .error-msg {
            font-size: 12px;
            font-weight: 600;
            color: #ef4444;
            min-height: 18px;
            margin-top: 6px;
            display: block;
        }

        .ok-msg {
            font-size: 12px;
            font-weight: 600;
            color: #10b981;
            min-height: 18px;
            margin-top: 6px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="topbar">
        <a href="index.html" class="back-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Week 8_2
        </a>
        <span class="badge">Exercise E2</span>
    </div>

    <div class="card">
        <h2>Email Validation</h2>
        <p class="card-subtitle">Task: Real-time 'input' listener checking validity.typeMismatch and managing valid-ok/valid-err classes.</p>

        <label for="rt-email">Email Address</label>
        <input type="email" id="rt-email" required placeholder="name@example.com">
        <div class="error-msg" id="email-err"></div>
        <div class="ok-msg" id="email-ok"></div>
    </div>

    <script>
        const emailInput = document.querySelector('#rt-email');
        const errEl = document.querySelector('#email-err');
        const okEl  = document.querySelector('#email-ok');

        let hasTyped = false;

        emailInput.addEventListener('input', () => {
            const v = emailInput.validity;
            const isEmpty = emailInput.value === '';

            if (!isEmpty) {
                hasTyped = true;
            }

            // if empty: clear classes, clear messages
            if (isEmpty) {
                emailInput.classList.remove('valid-ok', 'valid-err');
                errEl.textContent = hasTyped ? 'Email is required' : '';
                okEl.textContent = '';
                if (hasTyped) {
                    emailInput.classList.add('valid-err');
                }
            } else if (v.valid) {
                // else if v.valid: add valid-ok, clear err, show ok message
                emailInput.classList.remove('valid-err');
                emailInput.classList.add('valid-ok');
                errEl.textContent = '';
                okEl.textContent = '✓ Valid email address format';
            } else {
                // else: add valid-err, show correct error message
                emailInput.classList.remove('valid-ok');
                emailInput.classList.add('valid-err');
                okEl.textContent = '';
                if (v.typeMismatch) {
                    errEl.textContent = 'Not a valid email format';
                } else if (v.valueMissing) {
                    errEl.textContent = 'Email is required';
                } else {
                    errEl.textContent = 'Invalid email';
                }
            }
        });
    </script>
</body>
</html>
