<!DOCTYPE html>
<html>
<head><title>Topic 4: textContent</title></head>
<body style="font-family:system-ui;padding:20px">

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

  <h2 id="title">Hello</h2>
  <h2 id="msg">Original Text</h2>
  <input id="inp" type="text" placeholder="Type new text..." style="padding:8px;font-size:16px;width:200px">
  <button onclick="changeText()" style="padding:8px 16px;margin-left:8px;cursor:pointer">
    Change Text
  </button>
  <script>
const title = document.querySelector('#title');

// read the current text
console.log(title.textContent);  // "hello"

// write new text
title.textContent = 'Welcome to Web Programming!';

// html tags are treated as plain text (safe!)
title.textContent = '<b>This will NOT be bold</b>';

    function changeText() {
      const newText = document.getElementById('inp').value;
      // textcontent treats html tags as plain text (safe!)
      document.getElementById('msg').textContent = newText;
    }
  </script>
</body>
</html>
