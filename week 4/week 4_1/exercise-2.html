<!DOCTYPE html>
<html><body style="font-family:system-ui;padding:24px;display:flex;justify-content:center">

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

  <style>
    .card {
      padding: 24px; border-radius: 16px; width: 260px;
      background: #f0f4ff; border: 2px solid #c8d4f0;
      text-align: center; transition: all 0.3s;
    }
    .card.dark {
      background: #1a2340; border-color: #3a4a70;
      color: white;
    }
    .avatar {
      width: 70px; height: 70px; border-radius: 50%;
      background: #1a56db; display: inline-flex;
      align-items: center; justify-content: center;
      font-size: 32px; margin-bottom: 12px;
    }
    button { padding: 8px 20px; border-radius: 20px; cursor: pointer; border: none; margin-top: 14px; font-weight: bold; }
  </style>

  <div id="card" class="card">
    <div class="avatar">👩💻</div>
    <h2>Kahlen Ong</h2>
    <p>Web Programming Student</p>
    <button id="toggle-btn">🌙 Dark Mode</button>
  </div>

  <script>
    // 1. select #card and #toggle-btn
    const card = document.querySelector('#card');
    const toggleBtn = document.querySelector('#toggle-btn');

    // 2. add click listener to toggle-btn
    toggleBtn.addEventListener('click', () => {
      // 3. inside: toggle the 'dark' class on the card
      card.classList.toggle('dark');
      
      // 4. update button text: 'light mode' or 'dark mode'
      if (card.classList.contains('dark')) {
        toggleBtn.textContent = '☀️ Light Mode';
      } else {
        toggleBtn.textContent = '🌙 Dark Mode';
      }
    });
  </script>
</body></html>
