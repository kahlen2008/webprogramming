<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic 12: Removing Elements</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #f1f5f9; --text-main: #1e293b; --surface: #ffffff; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; padding: 60px 20px; margin: 0; display: flex; justify-content: center; }
        .container { max-width: 800px; width: 100%; }
        
        .demo-section { background: var(--bg-color); border-radius: 16px; padding: 20px; }
        .demo-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #64748b; font-weight: 700; margin-bottom: 16px; display: block; }
        
        .list-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .list-item { 
            background: white; border: 1px solid #cbd5e1; border-radius: 6px; 
            padding: 16px 20px; display: flex; justify-content: space-between; 
            align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.05); 
            font-size: 1.1rem; color: #0f172a; transition: all 0.2s ease-out; 
        }
        .remove-btn { 
            background: #d32f2f; color: white; border: none; padding: 8px 16px; 
            border-radius: 6px; cursor: pointer; font-weight: 600; display: flex; 
            align-items: center; gap: 6px; transition: background 0.2s; 
        }
        .remove-btn:hover { background: #b71c1c; }
        .restore-btn { 
            background: transparent; color: #1976d2; border: 2px solid #1976d2; 
            padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; 
            display: flex; align-items: center; gap: 6px; transition: background 0.2s;
        }
        .restore-btn:hover { background: #e3f2fd; }
    </style>
</head>
<body>
    <div class="container">

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

        <div class="demo-section">
            <span class="demo-title">Demo — Click ✕ to remove items</span>
            
            <div class="list-container" id="item-list">
                <!-- Items will be injected here -->
            </div>
            
            <button class="restore-btn" id="restore-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                Restore items
            </button>
        </div>
    </div>
    
    <script>
        const initialItems = ['Item One', 'Item Two', 'Item Three'];
        const listContainer = document.getElementById('item-list');
        const restoreBtn = document.getElementById('restore-btn');

        function renderItems() {
            listContainer.innerHTML = '';
            initialItems.forEach(text => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'list-item';
                
                const span = document.createElement('span');
                span.textContent = text;
                
                const btn = document.createElement('button');
                btn.className = 'remove-btn';
                btn.innerHTML = '✕ Remove';
                
                // Add event listener to remove the item
                btn.addEventListener('click', () => {
                    itemDiv.style.opacity = '0';
                    itemDiv.style.transform = 'scale(0.95)';
                    setTimeout(() => itemDiv.remove(), 200); // Wait for transition
                });

                itemDiv.appendChild(span);
                itemDiv.appendChild(btn);
                listContainer.appendChild(itemDiv);
            });
        }

        // Restore items when the button is clicked
        restoreBtn.addEventListener('click', renderItems);

        // Initial render
        renderItems();
    </script>
</body>
</html>
