<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 2 (Friday)</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --secondary-accent: #818cf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(129, 140, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(167, 139, 250, 0.15) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(45, 212, 191, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 80px 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            letter-spacing: -1px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #94a3b8;
            font-size: 1.1rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .back-link:hover {
            color: var(--accent-color);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .file-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--text-color);
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.5s ease forwards;
        }

        .file-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2), 0 0 15px var(--accent-glow);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .file-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; bottom: 0;
            width: 4px;
            background: linear-gradient(to bottom, var(--accent-color), var(--secondary-accent));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .file-card:hover::before {
            opacity: 1;
        }

        .icon {
            font-size: 1.8rem;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .file-name {
            font-size: 1.1rem;
            font-weight: 500;
            font-family: monospace;
            word-break: break-all;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Week 2 (Friday)</h1>
            <a href="../../index.html" class="back-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Back to Coursework
            </a>
        </header>
        <div class="grid">
            
            <a href="exercise-1.html" class="file-card">
                <div class="icon">📄</div>
                <div class="file-name">exercise-1.html</div>
            </a>

            <a href="exercise-2.html" class="file-card">
                <div class="icon">📄</div>
                <div class="file-name">exercise-2.html</div>
            </a>

            <a href="exercise-3.html" class="file-card">
                <div class="icon">📄</div>
                <div class="file-name">exercise-3.html</div>
            </a>

            <a href="exercise-4.html" class="file-card">
                <div class="icon">📄</div>
                <div class="file-name">exercise-4.html</div>
            </a>

            <a href="exercise-5.html" class="file-card">
                <div class="icon">📄</div>
                <div class="file-name">exercise-5.html</div>
            </a>

            <a href="exercise-6.html" class="file-card">
                <div class="icon">📄</div>
                <div class="file-name">exercise-6.html</div>
            </a>

            <a href="exercise-7.html" class="file-card">
                <div class="icon">📄</div>
                <div class="file-name">exercise-7.html</div>
            </a>

            <a href="exercise-8.html" class="file-card">
                <div class="icon">📄</div>
                <div class="file-name">exercise-8.html</div>
            </a>

        </div>
    </div>
</body>
</html>
