<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Figures</title></head>
<body>
  <!-- Figure 1: image with figcaption -->
  <figure>
    <img src="https://picsum.photos/400/250?random=10" alt="Random placeholder">
    <figcaption>Figure 1: A random placeholder from picsum</figcaption>
  </figure>

  <!-- Sentence with time element -->
  <p>This document was created on <time datetime="2026-09-11">September 11, 2026</time>.</p>

  <!-- Figure 2: pre+code block with figcaption -->
  <figure>
<pre><code>&lt;!DOCTYPE html&gt;
&lt;html lang="en"&gt;
&lt;head&gt;
  &lt;meta charset="UTF-8"&gt;
  &lt;title&gt;Title&lt;/title&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;/body&gt;
&lt;/html&gt;</code></pre>
    <figcaption>Listing 1: HTML5 skeleton template.</figcaption>
  </figure>
</body>
</html>
