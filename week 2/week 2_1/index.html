    <title>Week 2 (Monday)</title>
    <style>
        :root {
            --bg-color: #f4f1ea;
            --text-color: #333333;
            --link-color: #2c7a7b;
            --border-color: #d8d0c0;
            --hover-bg: #eae3d3;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 300;
            color: #2c3e50;
            margin: 0;
        }

        .back-link {
            text-decoration: none;
            color: #718096;
            font-weight: 500;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }
        
        .back-link:hover {
            color: var(--link-color);
        }

        .back-link::before {
            content: '←';
            margin-right: 8px;
            font-size: 1.2em;
        }

        .file-list {
            list-style: none;
            padding: 0;
            margin: 0;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .file-item {
            border-bottom: 1px solid var(--border-color);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-item:hover {
            background-color: rgba(255,255,255, 0.9);
            transform: translateX(4px);
        }

        .file-link {
            display: flex;
            align-items: center;
            padding: 16px 24px;
            text-decoration: none;
            color: var(--link-color);
            font-size: 1.05rem;
            font-weight: 500;
            width: 100%;
            font-family: monospace;
        }

        .icon {
            margin-right: 12px;
            font-size: 1.2rem;
            color: #a0aec0;
        }

    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
