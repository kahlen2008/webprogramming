<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>E3: Password Confirmation with ARIA — Week 6_2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #090d16;
            --card-bg: rgba(18, 24, 38, 0.9);
            --border: rgba(255, 255, 255, 0.09);
            --blue: #3b82f6;
            --green: #10b981;
            --red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --text-dim: #64748b;
            --radius-card: 20px;
            --radius-btn: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(245, 158, 11, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 20%, rgba(59, 130, 246, 0.12) 0%, transparent 45%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 20px 60px 20px;
        }

        .topbar {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: var(--radius-btn);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .back-link:hover {
            color: #ffffff;
            border-color: var(--blue);
            background: rgba(59, 130, 246, 0.15);
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.35);
            color: #fbbf24;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 34px 30px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .card-subtitle {
            color: var(--text-sub);
            font-size: 0.88rem;
            margin-bottom: 22px;
            line-height: 1.5;
            text-wrap: pretty;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
            margin-top: 14px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            border: 2px solid #334155;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            font-size: 14px;
            color: #f8fafc;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        input.ok {
            border-color: #10b981 !important;
            background: rgba(16, 185, 129, 0.08) !important;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.25) !important;
        }

        input.err {
            border-color: #ef4444 !important;
            background: rgba(239, 68, 68, 0.08) !important;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.25) !important;
        }

        .err-span {
            font-size: 12px;
            font-weight: 600;
            color: #ef4444;
            min-height: 18px;
            display: block;
            margin-top: 4px;
        }

        button {
            margin-top: 18px;
            width: 100%;
            background: linear-gradient(135deg, #1a56db 0%, #2563eb 100%);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.5);
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        }

        .toast-msg {
            display: none;
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 8px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #34d399;
            font-size: 0.88rem;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="topbar">
        <a href="index.html" class="back-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Week 6_2
        </a>
        <span class="badge">Exercise E3 · Challenge</span>
    </div>

    <div class="card">
        <h2>Create Account</h2>
        <p class="card-subtitle">Task: Password confirmation with setCustomValidity, real-time validation, and ARIA attributes.</p>

        <form id="pw-form">
            <label for="pw">Password</label>
            <input type="password" id="pw" required minlength="8"
                   aria-describedby="pw-err" aria-required="true"
                   placeholder="At least 8 characters">
            <span id="pw-err" class="err-span" aria-live="polite"></span>

            <label for="cfm">Confirm Password</label>
            <input type="password" id="cfm" required
                   aria-describedby="cfm-err" aria-required="true"
                   placeholder="Repeat your password">
            <span id="cfm-err" class="err-span" aria-live="polite"></span>

            <button type="submit">Create Account</button>
        </form>

        <div id="toast" class="toast-msg">
            ✓ Account validated and created successfully!
        </div>
    </div>

    <script>
        const pw     = document.querySelector('#pw');
        const cfm    = document.querySelector('#cfm');
        const pwErr  = document.querySelector('#pw-err');
        const cfmErr = document.querySelector('#cfm-err');
        const form   = document.querySelector('#pw-form');
        const toast  = document.querySelector('#toast');

        // 1. Validate Password length
        function validatePw() {
            const val = pw.value;
            if (val.length === 0) {
                pw.classList.remove('ok', 'err');
                pw.setAttribute('aria-invalid', 'false');
                pwErr.textContent = '';
                return false;
            } else if (val.length < 8) {
                pw.classList.remove('ok');
                pw.classList.add('err');
                pw.setAttribute('aria-invalid', 'true');
                pwErr.textContent = 'Password must be at least 8 characters';
                return false;
            } else {
                pw.classList.remove('err');
                pw.classList.add('ok');
                pw.setAttribute('aria-invalid', 'false');
                pwErr.textContent = '';
                return true;
            }
        }

        // 2. checkCfm() function: compare cfm.value to pw.value
        function checkCfm() {
            if (cfm.value === '') {
                cfm.classList.remove('ok', 'err');
                cfm.setAttribute('aria-invalid', 'false');
                cfmErr.textContent = '';
                cfm.setCustomValidity('');
                return false;
            }

            if (cfm.value === pw.value) {
                cfm.setCustomValidity('');
                cfm.classList.remove('err');
                cfm.classList.add('ok');
                cfm.setAttribute('aria-invalid', 'false');
                cfmErr.textContent = '';
                return true;
            } else {
                cfm.setCustomValidity('Passwords do not match.');
                cfm.classList.remove('ok');
                cfm.classList.add('err');
                cfm.setAttribute('aria-invalid', 'true');
                cfmErr.textContent = 'Passwords do not match';
                return false;
            }
        }

        // 3. Event listeners
        pw.addEventListener('input', () => {
            validatePw();
            if (cfm.value !== '') {
                checkCfm();
            }
        });

        cfm.addEventListener('input', checkCfm);

        // 4. Form submit listener
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const isPwValid = validatePw();
            const isCfmValid = checkCfm();

            if (isPwValid && isCfmValid) {
                toast.style.display = 'block';
                setTimeout(() => {
                    toast.style.display = 'none';
                }, 3500);
            }
        });
    </script>
</body>
</html>
