<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>E3: Style Valid/Invalid States with CSS — Week 6</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #090d16;
            --card-bg: rgba(18, 24, 38, 0.9);
            --border: rgba(255, 255, 255, 0.09);
            --blue: #3b82f6;
            --green: #10b981;
            --red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --text-dim: #64748b;
            --radius-card: 20px;
            --radius-btn: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.1) 0%, transparent 45%),
                radial-gradient(circle at 85% 20%, rgba(59, 130, 246, 0.12) 0%, transparent 45%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 20px 60px 20px;
        }

        .topbar {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: var(--radius-btn);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .back-link:hover {
            color: #ffffff;
            border-color: var(--blue);
            background: rgba(59, 130, 246, 0.15);
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 34px 32px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .card-subtitle {
            color: var(--text-sub);
            font-size: 0.88rem;
            margin-bottom: 18px;
            line-height: 1.5;
            text-wrap: pretty;
        }

        .legend-box {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
            padding: 10px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            font-size: 0.78rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-sub);
        }

        .dot-green { width: 8px; height: 8px; border-radius: 50%; background: #10b981; }
        .dot-red { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
        .dot-blue { width: 8px; height: 8px; border-radius: 50%; background: #3b82f6; }

        label {
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
            margin-top: 14px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            font-size: 14px;
            border: 2px solid #334155;
            background: rgba(15, 23, 42, 0.6);
            color: #f8fafc;
            border-radius: 8px;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        /* ======================================================== */
        /* ADD YOUR CSS VALIDATION STYLES BELOW                     */
        /* Uses :valid, :invalid, :placeholder-shown, :focus        */
        /* ======================================================== */

        /* Fields turn green border when valid (but not while empty) */
        input:not(:placeholder-shown):valid {
            border-color: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.25);
        }

        /* Fields turn red border when invalid (but not while empty) */
        input:not(:placeholder-shown):invalid {
            border-color: #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.25);
        }

        /* Fields show a blue outline on focus */
        input:focus {
            border-color: #1a56db;
            outline: 2px solid #3b82f6;
            outline-offset: 1px;
        }

        button[type="submit"] {
            margin-top: 22px;
            width: 100%;
            background: linear-gradient(135deg, #1a56db 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }

        button[type="submit"]:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.5);
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        }

        .toast-msg {
            display: none;
            margin-top: 18px;
            padding: 12px 14px;
            border-radius: 8px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #34d399;
            font-size: 0.88rem;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="topbar">
        <a href="index.html" class="back-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Week 6_1
        </a>
        <span class="badge">Exercise E3 · Intermediate</span>
    </div>

    <div class="card">
        <h2>Validation Styles Demo</h2>
        <p class="card-subtitle">Real-time dynamic CSS states based on field validity and placeholder visibility.</p>

        <div class="legend-box">
            <div class="legend-item"><span class="dot-green"></span> Valid (green)</div>
            <div class="legend-item"><span class="dot-red"></span> Invalid (red)</div>
            <div class="legend-item"><span class="dot-blue"></span> Focus (blue outline)</div>
        </div>

        <form onsubmit="event.preventDefault(); showSuccess();">
            <label for="v-email">Email (required)</label>
            <input type="email" id="v-email" required placeholder="name@example.com">

            <label for="v-pw">Password (min 8 chars)</label>
            <input type="password" id="v-pw" required minlength="8" placeholder="At least 8 characters">

            <label for="v-age">Age (18–65)</label>
            <input type="number" id="v-age" required min="18" max="65" placeholder="Your age">

            <button type="submit">Check Validation</button>
        </form>

        <div id="toast" class="toast-msg">
            ✓ All form fields are valid and passed check!
        </div>
    </div>

    <script>
        function showSuccess() {
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3500);
        }
    </script>

</body>
</html>
