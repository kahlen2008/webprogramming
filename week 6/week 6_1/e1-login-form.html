<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>E1: Build a Login Form — Week 6</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #090d16;
            --card-bg: rgba(18, 24, 38, 0.9);
            --border: rgba(255, 255, 255, 0.09);
            --border-hover: rgba(59, 130, 246, 0.4);
            --blue: #3b82f6;
            --blue-glow: rgba(59, 130, 246, 0.3);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --text-dim: #64748b;
            --radius-card: 20px;
            --radius-btn: 10px;
            --accent: #1a56db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(circle at 20% 15%, rgba(59, 130, 246, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 80% 20%, rgba(129, 140, 248, 0.1) 0%, transparent 45%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 20px 60px 20px;
        }

        /* Top Navigation Bar */
        .topbar {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: var(--radius-btn);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .back-link:hover {
            color: #ffffff;
            border-color: var(--blue);
            background: rgba(59, 130, 246, 0.15);
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
        }

        /* Form Card */
        .card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 36px 32px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .card-subtitle {
            color: var(--text-sub);
            font-size: 0.88rem;
            margin-bottom: 24px;
            text-wrap: pretty;
        }

        /* Exercise Specific Form Styling */
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #cbd5e1;
        }

        input[type="email"], input[type="password"] {
            padding: 12px 14px;
            border: 2px solid #334155;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            font-size: 15px;
            color: #f8fafc;
            width: 100%;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        input[type="email"]:focus, input[type="password"]:focus {
            border-color: #3b82f6;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
            outline: none;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 4px 0;
            cursor: pointer;
        }

        .checkbox-row input[type="checkbox"] {
            width: 17px;
            height: 17px;
            accent-color: #3b82f6;
            cursor: pointer;
        }

        .checkbox-row label {
            font-size: 14px;
            font-weight: 500;
            color: #94a3b8;
            cursor: pointer;
            user-select: none;
        }

        button[type="submit"] {
            background: linear-gradient(135deg, #1a56db 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
            margin-top: 6px;
        }

        button[type="submit"]:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.5);
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        }

        /* Success banner for testing */
        .toast-msg {
            display: none;
            margin-top: 18px;
            padding: 12px 14px;
            border-radius: 8px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #34d399;
            font-size: 0.88rem;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="topbar">
        <a href="index.html" class="back-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Week 6_1
        </a>
        <span class="badge">Exercise E1 · Beginner</span>
    </div>

    <div class="card">
        <h2>Sign In</h2>
        <p class="card-subtitle">Task: Complete login form with email, password, and remember me.</p>

        <!-- Build your form here -->
        <form method="post" action="#" onsubmit="event.preventDefault(); showSuccess();">
            <div class="field-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="name@example.com">
            </div>

            <div class="field-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

            <div class="checkbox-row">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Remember me</label>
            </div>

            <button type="submit">Sign In</button>
        </form>

        <div id="toast" class="toast-msg">
            ✓ Form submitted successfully! (method="post")
        </div>
    </div>

    <script>
        function showSuccess() {
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3500);
        }
    </script>

</body>
</html>
