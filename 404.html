<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>404 — Page Not Found | Web Programming</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg-main: #090d16;
            --bg-card: rgba(17, 24, 39, 0.94);
            --border-subtle: rgba(255, 255, 255, 0.1);
            --border-highlight: rgba(59, 130, 246, 0.4);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-blue: #60a5fa;
            --accent-purple: #c084fc;
            --accent-emerald: #34d399;
            --accent-rose: #f43f5e;
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-btn: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        h1, h2, h3, .badge-pill { text-wrap: balance; }
        p, .desc { text-wrap: pretty; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(59, 130, 246, 0.18) 0%, transparent 55%),
                radial-gradient(circle at 85% 75%, rgba(168, 85, 247, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 15% 85%, rgba(244, 63, 94, 0.1) 0%, transparent 55%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .error-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 44px 36px;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            width: 100%;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--accent-rose);
            background: rgba(244, 63, 94, 0.14);
            border: 1px solid rgba(244, 63, 94, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .error-code {
            font-family: 'Outfit', sans-serif;
            font-size: 5.5rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #ffffff 20%, #60a5fa 60%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: -6px;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.01em;
        }

        .desc {
            color: var(--text-secondary);
            font-size: 0.96rem;
            line-height: 1.6;
            max-width: 520px;
        }

        .invalid-path-box {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            padding: 10px 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.84rem;
            color: #f87171;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 100%;
            overflow-wrap: anywhere;
            word-break: break-all;
        }

        .actions-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            margin-top: 8px;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #1a56db 0%, #2563eb 100%);
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            padding: 12px 22px;
            border-radius: var(--radius-btn);
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.45);
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.65);
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            padding: 12px 20px;
            border-radius: var(--radius-btn);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--border-highlight);
            transform: translateY(-2px);
        }

        footer {
            margin-top: 24px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        @media (max-width: 580px) {
            .error-card { padding: 30px 20px; gap: 16px; }
            .error-code { font-size: 4.2rem; }
            h1 { font-size: 1.45rem; }
            .desc { font-size: 0.88rem; }
            .actions-group { flex-direction: column; align-items: stretch; }
            .btn-primary, .btn-secondary { width: 100%; }
        }
    </style>
</head>
<body>

    <main class="container">
        <article class="error-card">
            <span class="badge-pill">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                HTTP 404 Error
            </span>

            <div class="error-code">404</div>

            <h1>Page Not Found</h1>

            <p class="desc">
                The resource you are looking for does not exist on this server. It may have been moved, renamed, or mistyped in the URL bar.
            </p>

            <div class="invalid-path-box" id="invalid-path-container">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span id="requested-path">Loading requested route...</span>
            </div>

            <div class="actions-group">
                <a href="/webprogramming/index.html" class="btn-primary" id="hub-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    Return to Coursework Hub
                </a>

                <button type="button" class="btn-secondary" onclick="window.history.back()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    Go Back
                </button>
            </div>
        </article>

        <footer>
            Web Programming Coursework · Custom 404 Error Handler · GitHub Pages
        </footer>
    </main>

    <script>
        // Display the actual requested pathname dynamically
        document.addEventListener('DOMContentLoaded', () => {
            const pathElem = document.getElementById('requested-path');
            const hubLink = document.getElementById('hub-link');
            
            if (pathElem) {
                const currentPath = window.location.pathname || 'unknown route';
                pathElem.textContent = currentPath;
            }

            // Adjust hub link path whether hosted under /webprogramming/ or repository root
            if (hubLink) {
                if (window.location.pathname.startsWith('/webprogramming')) {
                    hubLink.href = '/webprogramming/index.html';
                } else {
                    hubLink.href = '/index.html';
                }
            }
        });
    </script>
</body>
</html>
