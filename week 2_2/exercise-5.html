<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Portfolio</title>
</head>
<body>
  <!-- header: h1 + nav with 4 links -->
  <header>
    <h1>Kahlen Ong</h1>
    <nav>
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <!-- section#about: figure+img+figcaption, p with abbr+mark -->
    <section id="about">
      <h2>About Me</h2>
      <figure>
        <img src="https://picsum.photos/200" alt="Profile Picture">
        <figcaption>A recent photo of me</figcaption>
      </figure>
      <p>I am studying at <abbr title="Gachon University">GU</abbr> and love <mark>web development</mark>.</p>
    </section>

    <!-- section#projects: article with header+time -->
    <section id="projects">
      <h2>Projects</h2>
      <article>
        <header>
          <h3>Portfolio Site</h3>
          <p><time datetime="2026-09">Sep 2026</time></p>
        </header>
        <p>A semantic web portfolio.</p>
      </article>
    </section>

    <!-- aside: skills list -->
    <aside id="skills">
      <h2>Skills</h2>
      <ul>
        <li>HTML5</li>
        <li>CSS3</li>
        <li>JavaScript</li>
      </ul>
    </aside>

    <!-- section#contact: address element -->
    <section id="contact">
      <h2>Contact</h2>
      <address>
        Email: <a href="mailto:test@gmail.com">student@gachon.ac.kr</a>
      </address>
    </section>
  </main>

  <!-- footer: copyright -->
  <footer>
    <p>&copy; 2026 Gachon Student</p>
  </footer>
</body>
</html>
