<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Inspirational Quotes</title></head>
<body>
  <h1>Quotes on Learning</h1>

  <!-- One p containing an inline <q> quote -->
  <p>Tim Berners-Lee famously declared, <q>This is for everyone.</q></p>

  <!-- Two blockquote elements with footer + cite -->
  <blockquote cite="https://example.com/quote1">
    <p>Simplicity is the soul of efficiency.</p>
    <footer>— <cite>Austin Freeman</cite></footer>
  </blockquote>
  
  <blockquote cite="https://example.com/quote2">
    <p>Talk is cheap. Show me the code.</p>
    <footer>— <cite>Linus Torvalds</cite></footer>
  </blockquote>

  <!-- details + summary: About these quotes (with abbr) -->
  <details>
    <summary>About these quotes</summary>
    <p>These quotes inspire <abbr title="Computer Science">CS</abbr> students worldwide.</p>
  </details>
</body>
</html>
