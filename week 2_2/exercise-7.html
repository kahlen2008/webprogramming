<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Inspirational Quotes</title></head>
<body>
  <h1>Quotes on Learning</h1>

  <!-- One p containing an inline <q> quote -->
  <p>Neil Armstrong famously declared, <q cite="https://en.wikiquote.org/wiki/Neil_Armstrong">That's one small step for a man, one giant leap for mankind.</q></p>

  <!-- Two blockquote elements with footer + cite -->
  <blockquote cite="https://en.wikiquote.org/wiki/Albert_Einstein">
    <p>Imagination is more important than knowledge.</p>
    <footer>— <cite>Albert Einstein</cite></footer>
  </blockquote>
  
  <blockquote cite="https://en.wikiquote.org/wiki/Steve_Jobs">
    <p>Stay hungry, stay foolish.</p>
    <footer>— <cite>Steve Jobs</cite></footer>
  </blockquote>

  <!-- details + summary: About these quotes (with abbr) -->
  <details>
    <summary>About these quotes</summary>
    <p>These quotes inspire <abbr title="Computer Science">CS</abbr> students worldwide.</p>
  </details>
</body>
</html>
