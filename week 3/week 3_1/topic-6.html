<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        .card {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin: 10px;                 
        }

        /* extra class layered on top */
        .featured {
            border-color: #10B981;
            background: #ecfdf5;
        }

        .large {
            font-size: 1.25rem;
        }
    </style>
</head>
<body>
    <div id="card">Plain Card</div>
    <div id="card featured">Featured Card (2 classes)</div>
    <div id="card featured large">Featured + Large Card (3 classes)</div>
</body>
</html>
