<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        /* #RRGGBB - R/G/B, each 00-FF */
        /* pure RED (FF, 00, 00) */
        .red {
            background-color: #FF0000;
        }

        /* pure GREEN (00, FF, 00) */
        .green {
            background-color: #00FF00;
        }

        /* pure BLUE (00, 00, FF) */
        .blue {
            background-color: #0000FF;
        }

        .white {
            background-color: #FFFFFF;
            border: 1px solid #ccc;
        }

        .black {
            background-color: #000000;
            color: white;
        }

        /* emerald */
        .custom {
            background-color: #10B981;
            color: white
        }

        /* shorthand only for when each pair repeats */
        .short-red {
            background-color: #F00;
        } /* same as FF0000 */

        div {
            padding: 8px 16px;
            margin: 4px;
            display: inline-block;
        }
    </style>
</head>
<body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

    <div class="red">#FF0000 is Red.</div>
    <div class="green">#00FF00 is Green.</div>
    <div class="blue">#0000FF is Blue.</div>
    <div class="white">#FFFFFF is White.</div>
    <div class="black">#000000 is Black.</div>
    <div class="custom">#10B981 is Emerald.</div>
    <div class="short-red">#F00 (shorthand)</div>
</body>
</html>
