        p {
            color: gray /* (0,0,0,1) type = 1 */;

            color: blue /* (0,0,1,0) class = 10 */;

            color: green /* (0,1,0,0) ID = 100 */;
        }     
        
        p.intro {
            color: purple /* (0,0,1,1) = 11 */;
        }    
        
        #main p {
            color: orange /* (0,1,0,1) = 101 */;
        }

        #main p (101)
        Winner: #main p with score 101 → orange  */
