<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        /* flexbox container */
        .flex-row {
            display: flex;
            gap: 12px;
            background: #f8fafc;
            padding: 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .flex-row.center {
            justify-content: center;
        }

        .flex-row.between {
            justify-content: space-between; 
        }

        .flex-row.align-c {
            align-items: center; 
        }

        .item {
            background: #10B981;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: 600;
        }

        .item.tall {
            height: 60px; 
            display: flex; 
            align-items: center;}

        .item.grow {
            flex: 1 /* grows to fill remaining space */;
        }
    </style>
</head>
<body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

    <div class="flex-row">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
    </div>

    <div class="flex-row between">
        <div class="item">Left</div>
        <div class="item">Right</div>
    </div>

    <div class="flex-row">
        <div class="item tall">Tall</div>
        <div class="item grow">flex: 1 — fills remaining width</div>
    </div>
</body>
</html>
