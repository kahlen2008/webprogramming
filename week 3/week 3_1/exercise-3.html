<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            .palette {
                display: flex;
                gap: 12px;
                /* TODO: add padding and a light background */
                padding: 24px;
                background-color: #f8fafc;
            }
            
            .swatch {
                /* TODO: set width: 100px, height: 100px, border-radius: 8px */
                width: 100px;
                height: 100px;
                border-radius: 8px;
                /* TODO: center the text using display:flex, align-items, justify-content */
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-weight: bold;
                font-size: 13px;
                font-family: monospace;
            }

            /* TODO: add 5 colour classes: .c1 through .c5 */
            /* Use: #EF4444  #F59E0B  #10B981  #3B82F6  #8B5CF6 */
            .c1 {
                background-color: #ef4444;
            }

            .c2 {
                background-color: #f59e0b;
            }

            .c3 {
                background-color: #10b981;
            }

            .c4 {
                background-color: #3b82f6;
            }

            .c5 {
                background-color: #8b5cf6;
            }
        </style>
    </head>
    <body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

        <div class="palette">
            <div class="swatch c1">#EF4444</div>
            <div class="swatch c2">#F59E0B</div>
            <div class="swatch c3">#10B981</div>
            <div class="swatch c4">#3B82F6</div>
            <div class="swatch c5">#8B5CF6</div>
        </div>
    </body>
</html>
