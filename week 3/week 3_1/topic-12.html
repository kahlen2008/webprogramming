<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        /* keep browser default (usually 16px) */
        html {
            font-size: 100%;
        }

        /* px = fixed, does not scale with user preferences */
        .px-example {
            font-size: 18px;
        }

        /* rem is relative to root html (1rem = 16px by default) */
        .rem-example {
            font-size: 1.5rem; /* 24px */
        }

        /* em - relative to PARENT element */
        .parent {
            font-size: 20px;
        }

        .child-em {
            font-size: 1.5em; /* 30px (1.5 × 20px from the parent) */
        }

        /* type scale using rem */
        .scale-sm {
            font-size: 0.875rem /* 14px */;
        } 

        .scale-base {
            font-size: 1rem /* 16px */;
        }

        .scale-lg {
            font-size: 1.25rem /* 20px */;
        }
        
        .scale-xl {
            font-size: 1.5rem /* 24px */;
        }
        
        .scale-2xl {
            font-size: 2rem /* 32px */;
        }
    </style>
</head>
<body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

    <p class="scale-sm">0.875rem is small text</p>
    <p class="scale-base">1rem is base body text</p>
    <p class="scale-lg">1.25rem is large text</p>
    <p class="scale-xl">1.5rem is extra large</p>
    <p class="scale-2xl">2rem is heading size</p>
</body>
</html>
