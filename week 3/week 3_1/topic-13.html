<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; font-size: 1.1rem; }

        /* named values */
        .normal {
            font-weight: normal /* = 400 */;
        }  
        
        .bold {
            font-weight: bold /* = 700 */;
        }    

        /* numeric values */
        .w300 {
            font-weight: 300 /* light */;
        }  
        
        .w400 {
            font-weight: 400 /* regular */;
        }  
        
        .w500 {
            font-weight: 500 /* medium */;
        }  
        
        .w600 {
            font-weight: 600 /* semibold */;
        }  
        
        .w700 {
            font-weight: 700 /* bold */;
        }  
        
        .w900 {
            font-weight: 900 /* black */;
        }  
    </style>
</head>
<body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

    <p class="w300">300 is light</p>
    <p class="w400">400 is regular (normal)</p>
    <p class="w500">500 is medium</p>
    <p class="w600">600 is semibold</p>
    <p class="w700">700 is bold</p>
    <p class="w900">900 is black</p>
</body>
</html>
