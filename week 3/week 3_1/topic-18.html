<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        /* default: content-box — width = content only */
        .content-box {
            box-sizing: content-box /* default */;
            width: 200px;
            padding: 10px;
            border: 5px solid #10B981;
            background: #ecfdf5;
            margin-bottom: 16px;
        } /* total = 200 + 10 * 2 + 5 * 2 = 230px */

        /* better: border-box, where width includes padding+border */
        .border-box {
            box-sizing: border-box;
            width: 200px;
            padding: 10px;
            border: 5px solid #7c3aed;
            background: #f5f3ff;
        }
        /* total = exactly 200px, content shrinks to 170px */

        p {
            font-size: 13px; 
            color: #475569; 
            margin-top: 4px;
        }
    </style>
</head>
<body>
  <div class="content-box">content-box</div>
  <p>-> Actual width = 200 + 10 * 2 + 5 * 2 = <strong>230px</strong></p>

  <div class="border-box">border-box</div>
  <p>-> Actual width = exactly <strong>200px</strong></p>
</body>
</html>
