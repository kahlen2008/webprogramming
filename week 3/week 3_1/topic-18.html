<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        /* default: content-box — width = content only */
        .content-box {
            box-sizing: content-box /* default */;
            width: 200px;
            padding: 10px;
            border: 5px solid #10B981;
            background: #ecfdf5;
            margin-bottom: 16px;
        } /* total = 200 + 10 * 2 + 5 * 2 = 230px */

        /* better: border-box, where width includes padding+border */
        .border-box {
            box-sizing: border-box;
            width: 200px;
            padding: 10px;
            border: 5px solid #7c3aed;
            background: #f5f3ff;
        }
        /* total = exactly 200px, content shrinks to 170px */

        p {
            font-size: 13px; 
            color: #475569; 
            margin-top: 4px;
        }
    </style>
</head>
<body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

  <div class="content-box">content-box</div>
  <p>-> Actual width = 200 + 10 * 2 + 5 * 2 = <strong>230px</strong></p>

  <div class="border-box">border-box</div>
  <p>-> Actual width = exactly <strong>200px</strong></p>
</body>
</html>
