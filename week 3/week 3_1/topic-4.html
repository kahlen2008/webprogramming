<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* classic CSS reset using * */
        *, *::before, *::after {
            box-sizing: border-box; /*padding / border included in width -> very useful */
            margin: 0;
            padding: 0;                   
        }

        /* add styles on top cleanly */
        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            background: #f8fafc;
            color: #1e293b;
        }

        /* avoid this as it affects every element */
        /* *{color: blue;} -> this is too aggressive */
    </style>
</head>
<body>
    
</body>
</html>
