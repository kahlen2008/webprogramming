<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        /* all text inherits this */
        body {
            color: #1e293b;
        }       

        /* named colour */
        .red {
            color: red;
        }
        
        /* hex colour */
        .green {
            color: #15803d;
        }    
        
        /* rgb */
        .blue {
            color: rgb(29, 78, 216);
        }

        /* hsl */
        .purple {
            color: hsl(262, 83%, 58%);
        }

        /* muted / grey */
        .muted {
            color: #94a3b8;
        }

        /* color on a heading - children inherit it */
        h2 {
            color: #10B981;
        }
    </style>
</head>
<body>
    <h2>All these paragraphs use the color property from CSS:</h2>
    <p class="red">Named colour: red</p>
    <p class="green">Hex colour: #15803d</p>
    <p class="blue">RGB colour: rgb(29, 78, 216)</p>
    <p class="purple">HSL colour: hsl(262, 83%, 58%)</p>
    <p class="muted">Muted grey text.</p>
</body>
</html>
