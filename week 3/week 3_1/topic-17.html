<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        .box {
            background: #ecfdf5;
            border: 2px solid #10B981;
            padding: 12px;
            width: 280px;
        }

        .m-none {
            margin: 0;
        }
        
        .m-all {
            margin: 20px;
        }
        
        .m-auto {
            margin: 0 auto /* centres the block */;
        }
        
        .m-sides {
            margin-left: 40px;
            margin-right: 40px;
        }

        /* collapse demonstration */
        .p1 {
            margin-bottom: 20px; 
            background: #fef3c7; 
            padding: 8px;
        }

        .p2 {
            margin-top: 30px; 
            background: #dbeafe; 
            padding: 8px;
        }
    </style>
</head>
<body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

  <div class="box m-none">margin: 0</div>
  <div class="box m-all">margin: 20px applies for all sides</div>
  <div class="box m-auto">margin: 0 auto = centred!</div>
  <hr>
  <p class="p1">margin-bottom: 20px (yellow)</p>
  <p class="p2">margin-top: 30px (blue) — gap = 30px, not 50px (collapsed)</p>
</body>
</html>
