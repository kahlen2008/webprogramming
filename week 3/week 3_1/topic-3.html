<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Basic CSS Rule Anatomy (i changed the word property in the example to text-align and font-size) */
        selector {
            font-size: value; /* one declaration */
            text-align: value; /* another declaration */
                   
        }

        /* Real Examples */
        h1 {
            color: #15803d; /* text colour */
            font-size: 2rem; /* size */
            font-weight: bold; /* weight */
            text-align: center; /* alignment */
        }

        p {
            line-height: 1.7; /* space between lines */
            max-width: 65ch; /* column width */
        }

        /* Common Mistakes */
        /* h1 {
            color = red 
        }    ← = instead of : → WRONG */

        /* h1 {
            color: red
        }     ← missing semicolon → risky */
    </style>
</head>
<body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

    
</body>
</html>
