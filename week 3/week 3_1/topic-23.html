<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
    /* which wins? match the selector and count the score. */

    p {
        color: gray /* score: 0, 0, 0, 1 - type */;
    }

    .highlight {
        color: blue /* score: 0, 0, 1, 0 - class */;
    }

    p.highlight {
        color: purple /* score: 0, 0, 1, 1 - type + class */;
    }

    #note {
        color: green /* score: 0, 1, 0, 0 - ID */; 
    }

    /* combinators add up */
    div p {
        font-style: italic /* 0, 0, 0, 2 */;
    }

    div .highlight {
        font-weight: bold /* 0, 0, 1, 1 */;
    }
  </style>
</head>
<body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

    <!-- gray is matched by p(0,0,0,1) only -->
    <p>Plain paragraph - gray</p>

    <!-- for purple, p.highlight(0,0,1,1) beats p (0,0,0,1) and .highlight (0,0,1,0) -->
    <p class="highlight">P with class - purple (p.highlight wins)</p>

    <!-- green: #note (0,1,0,0) beats everything above -->
    <p class="highlight" id="note">P with class AND id - green (#note wins)</p>
</body>
</html>
