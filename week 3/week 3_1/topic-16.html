<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
    .box {
        background: #ecfdf5;
        border: 2px solid #10B981;
        width: 300px;
        font-family: sans-serif;
    }

    /* different padding examples */
    .p-none {
        padding: 0;
    }
    
    .p-all {
        padding: 20px;
    }
    
    .p-tb-lr {
        padding: 10px 40px /* top + bottom ; left + right */;
    }     
    
    .p-sides {
        padding-left: 32px;
        padding-right: 32px;
    }

    .label {
        font-size: 11px;
        color: #059669;
        margin-bottom: 6px;
    }

    div {
        margin-bottom: 10px;
    }
    </style>
</head>
<body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

    <div class="box p-none">
        <span class="label">padding: 0 means that content touches the border</span>
        Content here    
    </div>
    <div class="box p-all">
        <span class="label">padding: 20px applies for all four sides</span>
        Content here
    </div>
    <div class="box p-tb-lr">
        <span class="label">padding: 10px 40px = top/bottom + left/right</span>
        Content here
    </div>
</body>
</html>
