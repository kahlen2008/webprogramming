<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        .normal {
            font-style: normal;
        }

        .italic {
            font-style: italic;
        }

        .oblique {
            font-style: oblique /* artificial slant */;
        }

        /* practical use: labels, captions, quotes */
        blockquote {
            font-style: italic;
            color: #64748b;
            border-left: 3px solid #10B981;
            padding-left: 16px;
        }

        .caption {
            font-style: italic;
            font-size: 0.875rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

    <p class="normal">Normal gives upright text.</p>
    <p class="italic">Italic gives true italic letterforms.</p>
    <p class="oblique">Oblique makes it artificially slanted.</p>
    <br>
    <blockquote>"CSS is the language of the web's visual layer."</blockquote>
    <p class="caption">Figure 1: Example of a styled blockquote</p>
</body>
</html>
