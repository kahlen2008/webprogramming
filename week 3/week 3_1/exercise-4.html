<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            body {
                font-family: sans-serif;
                padding: 20px;
            }

            .margin-box {
                background-color: #fde68a;
                padding: 30px;
                /* TODO: add text-align: center and a max-width */
                text-align: center;
                max-width: 600px;
                margin: 0 auto;
            }
            
            .border-box {
                /* TODO: background #6b7280, padding 20px */
                background-color: #6b7280;
                padding: 20px;
            }

            .padding-box {
                /* TODO: background #bfdbfe, padding 24px */
                background-color: #bfdbfe;
                padding: 24px;
            }

            .content-box {
                /* TODO: background #ddd6fe, padding 20px */
                background-color: #ddd6fe;
                padding: 20px;
            }

            .layer-label {
                font-size: 11px;
                font-weight: bold;
                text-transform: uppercase;
                letter-spacing: 0.08em;
            }
        </style>
    </head>
    <body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

        <div class="margin-box">
            <span class="layer-label">Margin</span>
            <div class="border-box">
                <span class="layer-label">Border</span>
                <div class="padding-box">
                    <span class="layer-label">Padding</span>
                    <div class="content-box">
                        <span class="layer-label">Content</span>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
