<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        /* rgb(red 0-255, green 0-255, blue 0-255) */
        /* red */
        .ex1 {
            background-color: rgb(255, 0, 0);
            color: white;
        }
        
        /* green */
        .ex2 {
            background-color: rgb(21, 128, 61);
            color: white;
        }
        
        /* blue */
        .ex3 {
            background-color: rgb(29, 89, 216);
            color: white;
        }

        /* grey */
        .ex4 {
            background-color: rgb(100, 100, 100);
            color: white;
        }

        /* rgba, where a = alpha (opacity ranges from 0.0-1.0) */
        /* 50% transparent black */
        .overlay {
            background-color: rgba(0, 0, 0, 0.5);
            color: white; 
            padding: 20px;
        }

        /* translucent green */
        .glass {
            background-color: rgba(21, 128, 61, 0.15);
            border: 1px solid rgba(21, 128, 61, 0.4);
            padding: 12px;
        }

        div {
            padding: 8px 16px;
            margin: 6px;
        }
    </style>
</head>
<body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

    <div class="ex1">rgb(255, 0, 0) is Red.</div>
    <div class="ex2">rgb(21, 128, 61) is Green.</div>
    <div class="ex3">rgb(29, 78, 216) is Blue.</div>
    <div class="ex4">rgb(100, 100, 100) is Grey.</div>
    <div class="overlay">rgba(0, 0, 0, 0.5) is a 50% black overlay.</div>
    <div class="glass">rgba green 15% - glassmorphism card</div>
</body>
</html>
