<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        /* ID selector: targets the one element with id="main-title" */
        #main-title {
            color: #15830d;
            font-size: 2.5rem;
            border-left: 5px solid #10B981;
            padding-left: 12px;                   
        }

        /* targets element with id="hero-banner" */
        #hero-banner {
            background: #ecfdf5;
            padding: 40px;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div id="hero-banner">
        <h1 id="main-title">CSS Introduction</h1>
        <p>This heading is styled via its unique id.</p>
    </div>
</body>
</html>
