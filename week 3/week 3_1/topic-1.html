<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Demo</title>
    <style>
        /* Without this CSS block, the page looks plain. */
        body {
            font-family: sans-serif;
            background: #f0f9ff;
            color: #1e293b;
        }

        h1 {
            color: #15803d;
            font-size: 2rem;
        }

        p {
            max-width: 60ch;
            line-height: 1.7;
        }

    </style>
</head>
<body>
    <h1>Hello, CSS!</h1>
    <p>This heading is green and the backgroung is light blue -
        all controlled by CSS, not HTML.</p>
</body>
</html>
