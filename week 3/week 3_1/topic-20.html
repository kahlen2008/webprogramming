<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
    .box {
        padding: 16px; 
        margin: 8px 0; 
        border: 2px solid #10B981;
    }

    .hidden-none {
        display: none /* gone — no space */;
    }          
    
    .hidden-visibility {
        visibility: hidden /* hidden but space kept */;
    }      
    
    .hidden-opacity {
        opacity: 0 /* transparent, space kept */;
    }              
  </style>
</head>
<body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

    <div class="box">Box 1 - visible.</div>
    <div class="box hidden-none">Box 2 - display: none (you cannot see this)</div>
    <div class="box">Box 3 - visible (no gap above from box 2!)</div>
    <div class="box hidden-visibility">Box 4 - visibility: hidden (space is kept)</div>
    <div class="box">Box 5 - there is a gap above from box 4</div>
    <hr>

    <!-- Toggle with JavaScript -->
    <button onclick="document.getElementById('msg').style.display = document.getElementById('msg').style.display === 'none' ? 'block' : 'none'">
    Toggle Message
    </button>
    
    <div id="msg" class="box" style="display:none">Hello! I was hidden.</div>
</body>
</html>
