<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Method 1: External stylesheet (best for real projects) -->
    <link rel="stylesheet" href="style.css">

    <!-- Method 2: Internal <style> block (good for single pages / demos) -->
    <style>
        h2 {
            color: #15803d;
        }

        p {
            font-family: Georgia, serif;
        }
    </style>
</head>
<body>
    <!-- Method 3: Inline style attribute (avoid - hard to maintain) -->
    <p style="color: red; font-size: 20px;">Inline styled paragraph.</p>

    <h2>Internal style heading.</h2>
    <p>Internal style paragraph.</p>
</body>
</html>
