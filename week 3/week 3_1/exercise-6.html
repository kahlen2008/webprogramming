<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            
            body {
                font-family: sans-serif;
            }

            /* TODO: style the nav — dark background, display flex, padding */
            nav {
                background-color: #1e293b;
                display: flex;
                padding: 1.5rem 2rem;
                justify-content: space-between;
                align-items: center;
            }

            /* TODO: style .logo — white, bold, no decoration */
            .logo {
                color: white;
                font-weight: bold;
                text-decoration: none;
                font-size: 1.25rem;
            }

            /* TODO: style .nav-links — display flex, gap */
            .nav-links {
                display: flex;
                gap: 2rem;
            }

            /* TODO: style .nav-links a — white, no underline */
            .nav-links a {
                color: white;
                text-decoration: none;
                font-weight: 500;
                transition: color 0.2s;
            }

            /* TODO: hover state — emerald #10B981 */
            .nav-links a:hover {
                color: #10b981;
            }
        </style>
    </head>
    <body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

        <nav>
            <a href="#" class="logo">WebPro</a>
            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">Topics</a>
                <a href="#">Quiz</a>
                <a href="#">About</a>
            </div>
        </nav>
    </body>
</html>
