<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            
            body {
                font-family: sans-serif;
            }

            /* TODO: style the nav — dark background, display flex, padding */
            nav {
                background-color: #1e293b;
                display: flex;
                padding: 1.5rem 2rem;
                justify-content: space-between;
                align-items: center;
            }

            /* TODO: style .logo — white, bold, no decoration */
            .logo {
                color: white;
                font-weight: bold;
                text-decoration: none;
                font-size: 1.25rem;
            }

            /* TODO: style .nav-links — display flex, gap */
            .nav-links {
                display: flex;
                gap: 2rem;
            }

            /* TODO: style .nav-links a — white, no underline */
            .nav-links a {
                color: white;
                text-decoration: none;
                font-weight: 500;
                transition: color 0.2s;
            }

            /* TODO: hover state — emerald #10B981 */
            .nav-links a:hover {
                color: #10b981;
            }
        </style>
    </head>
    <body>
        <nav>
            <a href="#" class="logo">WebPro</a>
            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">Topics</a>
                <a href="#">Quiz</a>
                <a href="#">About</a>
            </div>
        </nav>
    </body>
</html>
