<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My CSS Profile - Week 3</title>
    <style>
        /* -- reset -- */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0; 
            padding: 0;
        }

        /* ── base ── */
        body {
            font-family: 'Segoe UI', sans-serif;
            font-size: 1rem;
            line-height: 1.7;
            background-color: #f0fdf4;
            color: #1e293b;
        }

        /* ── layout ── */
        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* ── profile card ── */
        .card {
            background-color: #ffffff;
            border: 1px solid #bbf7d0;
            border-radius: 16px;
            padding: 40px;
        }

        /* ── header row ── */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 28px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #15803d;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        h1 {
            font-size: 1.75rem; 
            color: #15803d;
        }

        .role {
            color: #64748b; 
            font-size: 0.9rem;
        }

        /* ── skills list ── */
        .skills {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
            
        .skill-badge {
            background-color: #dcfce7;
            color: #15803d;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

        <div class="card">
        <div class="profile-header">
            <div class="avatar">😊</div>
            <div>
            <h1>Kim Jisoo</h1>
            <p class="role">Web Programming Student · Gachon University</p>
            </div>
        </div>
        <p>Hello! I am learning HTML and CSS in Week 3. Today I styled this
            profile card using everything in the CSS Introduction guide.</p>
        <div class="skills">
            <span class="skill-badge">HTML5</span>
            <span class="skill-badge">CSS3</span>
            <span class="skill-badge">Flexbox</span>
            <span class="skill-badge">Box Model</span>
        </div>
        </div>
    </div>
</body>
</html>
