<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            body {
                background: #f0fdfa;
                padding: 30px;
                font-family: sans-serif;
            }
            .row {
                display: flex;
                gap: 20px;
                margin-bottom: 20px;
                flex-wrap: wrap;
            }

            /* border-radius variety */
            .r-none {
                border-radius: 0;
            }

            .r-sm {
                border-radius: 6px;
            }

            .r-lg {
                border-radius: 20px;
            }

            .r-pill {
                border-radius: 100px;
            }

            .r-circle {
                border-radius: 50%;
                width: 80px;
                height: 80px;
                line-height: 80px;
                text-align: center;
            }

            /* box-shadow variety */
            .s-sm {
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            }
            
            .s-md {
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            }

            .s-lg {
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            }

            .s-col {
                box-shadow: 0 4px 20px rgba(15, 118, 110, 0.4);
            } /* coloured shadow */

            .s-in {
                box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.2);
                background: #ccfbf1;
            }

            .box {
                background: #0f766e;
                color: white;
                padding: 12px 20px;
                font-size: 14px;
                font-weight: bold;
            }

            .circle-box {
                background: #14b8a6;
                color: white;
                font-size: 14px;
                font-weight: bold;
            }
        </style>
    </head>
    <body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

        <div class="row">
            <div class="box r-none">radius: 0</div>
            <div class="box r-sm">6px</div>
            <div class="box r-lg">20px</div>
            <div class="box r-pill">pill</div>
            <div class="box r-circle circle-box">50%</div>
        </div>
        <div class="row">
            <div class="box r-sm s-sm">shadow sm</div>
            <div class="box r-sm s-md">shadow md</div>
            <div class="box r-sm s-lg">shadow lg</div>
            <div class="box r-sm s-col">colored shadow</div>
            <div class="box r-sm s-in">inset shadow</div>
        </div>
    </body>
</html>
