<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            /* :hover - mouse over */
            .btn {
                background: #0f766e;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 6px;
                cursor: pointer;
                transition:
                    background 0.2s,
                    transform 0.15s;
            }

            .btn:hover {
                background: #14b8a6;
                transform: translateY(-2px);
            }

            .btn:active {
                transform: scale(0.97);
            }

            /* :focus-visible - keyboard focus only */
            input {
                border: 2px solid #94a3b8;
                border-radius: 6px;
                padding: 8px 12px;
                font-size: 15px;
                outline: none;
                transition: border-color 0.2s;
            }

            input:focus-visible {
                border-color: #0f766e;
                box-shadow: 0 0 0 3px #99f6e4;
            }

            /* :nth-child - stripe table rows */
            table {
                border-collapse: collapse;
                width: 260px;
                margin-top: 16px;
                font-size: 14px;
            }

            td {
                padding: 6px 12px;
            }

            tr:nth-child(even) {
                background: #f0fdfa;
            }

            tr:nth-child(odd) {
                background: white;
            }
            
            tr:first-child {
                background: #0f766e;
                color: white;
                font-weight: bold;
            }
        </style>
    </head>
    <body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

        <button class="btn">Hover & Click Me</button><br /><br />
        <input type="text" placeholder="Tab here to see :focus-visible" /><br />
        <table>
            <tr>
                <td>Name</td>
                <td>Score</td>
            </tr>
            <tr>
                <td>Alice</td>
                <td>98</td>
            </tr>
            <tr>
                <td>Bob</td>
                <td>85</td>
            </tr>
            <tr>
                <td>Carol</td>
                <td>91</td>
            </tr>
            <tr>
                <td>Dave</td>
                <td>77</td>
            </tr>
        </table>
    </body>
</html>
