<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            body {
                color: #0f766e;
                font-family: "Georgia", serif;
                font-size: 18px;
            }

            /* inherit: force child to use parent's colour */
            .parent {
                color: #f43f5e; /* red */
                font-size: 20px;
            }

            .child-inherit {
                color: inherit;
            } /* also red - takes from .parent */

            .child-normal {
            } /* also red - color IS inherited */
            
            .child-initial {
                color: initial;
            } /* browser default: black */

            /* border does NOT inherit */
            .with-border {
                border: 3px solid currentColor;
                padding: 8px;
            }

            /* inherit border from parent */
            .parent-bordered {
                border: 3px solid #0f766e;
                padding: 12px;
            }
            
            .inherit-border {
                border: inherit;
            } /* takes parent's border */

            p {
                margin: 8px 0;
            }
        </style>
    </head>
    <body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

        <div class="parent">
            <p>Parent - color: red</p>
            <p class="child-inherit">child color: inherit -> red</p>
            <p class="child-normal">
                child with no color set -> also red (inherits)
            </p>
            <p class="child-initial">
                child color: initial -> black (browser default)
            </p>
        </div>
        <hr />
        <div class="parent-bordered">
            Parent has a border
            <div class="inherit-border" style="margin-top: 8px">
                border: inherit -> same border
            </div>
        </div>
    </body>
</html>
