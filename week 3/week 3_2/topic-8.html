<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            /* Fade + slide in */
            @keyframes fadeSlideIn {
                from {
                    opacity: 0;
                    transform: translateY(30px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* Pulse */
            @keyframes pulse {
                0%,
                100% {
                    transform: scale(1);
                    opacity: 1;
                }
                50% {
                    transform: scale(1.1);
                    opacity: 0.7;
                }
            }

            /* Spinning loader */
            @keyframes spin {
                from {
                    transform: rotate(0deg);
                }
                to {
                    transform: rotate(360deg);
                }
            }

            .hero {
                animation: fadeSlideIn 0.8s ease-out forwards;
                font-size: 28px;
                font-weight: bold;
                color: #0f766e;
                padding: 20px;
            }

            .badge {
                display: inline-block;
                background: #0f766e;
                color: white;
                padding: 6px 16px;
                border-radius: 20px;
                animation: pulse 1.5s ease-in-out infinite;
            }

            .spinner {
                width: 40px;
                height: 40px;
                border: 4px solid #ccfbf1;
                border-top-color: #0f766e;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
                margin: 20px;
            }
        </style>
    </head>
    <body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

        <div class="hero">Hello! I faded and slid in on load.</div>
        <span class="badge">Live</span>
        <div class="spinner"></div>
    </body>
</html>
