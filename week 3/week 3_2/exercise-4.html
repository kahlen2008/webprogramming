<!doctype html>
<html lang="en-GB">
    <head>
        <meta charset="UTF-8" />
        <title>Exercise 4</title>
        <style>
            /* declare :root variables */
            :root {
                --primary: #0f766e;
                --accent: #14b8a6;
                --bg: #f0fdfa;
                --text: #134e4a;
                --radius: 8px;
            }

            /* dark mode media query */
            @media (prefers-color-scheme: dark) {
                :root {
                    --primary: #5eead4;
                    --accent: #2dd4bf;
                    --bg: #134e4a;
                    --text: #ccfbf1;
                }
            }

            body {
                background: var(--bg);
                color: var(--text);
                font-family: sans-serif;
                padding: 20px;
            }

            .btn {
                /* use var(--primary) for background */
                background: var(--primary);
                color: white;
                border: none;
                padding: 10px 20px;
                cursor: pointer;
                border-radius: var(--radius);
            }
            .card {
                /* use variables for background, border, border-radius */
                background: var(--bg);
                border: 2px solid var(--accent);
                border-radius: var(--radius);
                padding: 20px;
                margin-top: 16px;
            }
        </style>
    </head>
    <body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

        <button class="btn">Click Me!</button>
        <div class="card">A themed card using CSS variables.</div>
    </body>
</html>
