<!doctype html>
<html lang="en-GB">
    <head>
        <meta charset="UTF-8" />
        <title>Exercise 4</title>
        <style>
            /* declare :root variables */
            :root {
                --primary: #0f766e;
                --accent: #14b8a6;
                --bg: #f0fdfa;
                --text: #134e4a;
                --radius: 8px;
            }

            /* dark mode media query */
            @media (prefers-color-scheme: dark) {
                :root {
                    --primary: #5eead4;
                    --accent: #2dd4bf;
                    --bg: #134e4a;
                    --text: #ccfbf1;
                }
            }

            body {
                background: var(--bg);
                color: var(--text);
                font-family: sans-serif;
                padding: 20px;
            }

            .btn {
                /* use var(--primary) for background */
                background: var(--primary);
                color: white;
                border: none;
                padding: 10px 20px;
                cursor: pointer;
                border-radius: var(--radius);
            }
            .card {
                /* use variables for background, border, border-radius */
                background: var(--bg);
                border: 2px solid var(--accent);
                border-radius: var(--radius);
                padding: 20px;
                margin-top: 16px;
            }
        </style>
    </head>
    <body>
        <button class="btn">Click Me!</button>
        <div class="card">A themed card using CSS variables.</div>
    </body>
</html>
