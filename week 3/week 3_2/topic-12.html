<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            /* Named areas layout */
            .page {
                display: grid;
                grid-template-areas:
                    "header  header  header"
                    "sidebar main    main"
                    "footer  footer  footer";
                grid-template-columns: 200px 1fr 1fr;
                grid-template-rows: auto 1fr auto;
                gap: 12px;
                min-height: 340px;
                padding: 12px;
                background: #f0fdfa;
            }

            .page > * {
                border-radius: 8px;
                padding: 16px;
                font-size: 14px;
                font-weight: bold;
            }

            header {
                grid-area: header;
                background: #0f766e;
                color: white;
            }
            .sidebar {
                grid-area: sidebar;
                background: #ccfbf1;
                color: #0f766e;
            }
            main {
                grid-area: main;
                background: white;
                border: 2px solid #14b8a6;
                color: #0f766e;
            }
            footer {
                grid-area: footer;
                background: #1e293b;
                color: #94a3b8;
            }

            /* Simple 3-column card grid */
            .cards {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
                margin-top: 12px;
            }
            .cards div {
                background: #0f766e;
                color: white;
                padding: 12px;
                border-radius: 6px;
                text-align: center;
                font-size: 13px;
            }
        </style>
    </head>
    <body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

        <div class="page">
            <header>Header (spans all 3 columns)</header>
            <div class="sidebar">Sidebar<br />(200px fixed)</div>
            <main>Main content (flex: fills remaining 2 columns)</main>
            <footer>Footer (spans all 3 columns)</footer>
        </div>
        <div class="cards">
            <div>Card 1</div>
            <div>Card 2</div>
            <div>Card 3</div>
            <div>Card 4</div>
            <div>Card 5</div>
            <div>Card 6</div>
        </div>
    </body>
</html>
