<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            body {
                margin: 0;
                font-family: sans-serif;
            }

            /* Fixed nav - always visible, sits outside the flow */
            .fixed-nav {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                background: #0f766e;
                color: white;
                padding: 14px 24px;
                z-index: 100; /* above everything else */
            }

            .content {
                padding-top: 60px;
            } /* offset for fixed nav height */

            /* Sticky section title */
            .sticky-header {
                position: sticky;
                top: 56px; /* sticks 56px from top (below fixed nav) */
                background: #ccfbf1;
                border-left: 4px solid #14b8a6;
                padding: 10px 16px;
                font-weight: bold;
                color: #0f766e;
            }

            .section-body {
                padding: 20px;
                height: 300px; /* tall enough to scroll */
                background: #f0fdfa;
            }
        </style>
    </head>
    <body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

        <nav class="fixed-nav">
            Fixed Navigation - always visible while scrolling
        </nav>
        <div class="content">
            <div>
                <div class="sticky-header">Section A - sticky header</div>
                <div class="section-body">
                    Scroll down to see the sticky header in action…
                </div>
            </div>
            <div>
                <div class="sticky-header">
                    Section B - another sticky header
                </div>
                <div class="section-body">
                    Each section has its own sticky label.
                </div>
            </div>
        </div>
    </body>
</html>
