<!doctype html>
<html lang="en-GB">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>Exercise 5</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: sans-serif;
            }

            /* .nav — position fixed, top 0, full width, dark background, flex, padding */
            .nav {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                background: #1e293b;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 16px 32px;
                z-index: 1000;
            }

            /* .nav-logo — white, bold, no underline */
            .nav-logo {
                color: white;
                font-weight: bold;
                text-decoration: none;
                font-size: 20px;
            }

            /* .nav-links — flex, gap */
            .nav-links {
                display: flex;
                gap: 24px;
            }

            /* .nav-links a — light grey, no underline */
            .nav-links a {
                color: #cbd5e1;
                text-decoration: none;
            }

            /* hover — teal #14b8a6 */
            .nav-links a:hover {
                color: #14b8a6;
            }

            /* Content to scroll */
            .content {
                padding-top: 70px;
            }
            .section {
                height: 300px;
                padding: 40px;
                font-size: 18px;
            }
        </style>
    </head>
    <body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

        <nav class="nav">
            <a href="#" class="nav-logo">CSS</a>
            <div class="nav-links">
                <a href="#s1">Home</a>
                <a href="#s2">Topics</a>
                <a href="#s3">Quiz</a>
            </div>
        </nav>
        <div class="content">
            <div class="section" id="s1" style="background: #f0fdfa">
                Section 1 — scroll down…
            </div>
            <div class="section" id="s2" style="background: #ccfbf1">
                Section 2 — nav stays fixed!
            </div>
            <div class="section" id="s3" style="background: #99f6e4">
                Section 3
            </div>
        </div>
    </body>
</html>
