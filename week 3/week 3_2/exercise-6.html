<!doctype html>
<html lang="en-GB">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>Exercise 6</title>
        <style>
            /* :root variables — --primary, --accent, --bg, --text, --radius */
            :root {
                --primary: #0f766e;
                --accent: #14b8a6;
                --bg: #f8fafc;
                --text: #0f172a;
                --card-bg: white;
                --radius: 12px;
            }

            /* * reset */
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            /* body styles */
            body {
                background: var(--bg);
                color: var(--text);
                font-family: sans-serif;
                padding: 24px;
            }

            /* .grid — display:grid, 1 column base, gap */
            .grid {
                display: grid;
                grid-template-columns: 1fr;
                gap: 20px;
                margin-top: 24px;
            }

            /* @media (min-width: 640px) — 3 columns */
            @media (min-width: 640px) {
                .grid {
                    grid-template-columns: repeat(3, 1fr);
                }
            }

            /* .card — border, padding, radius, transition */
            .card {
                background: var(--card-bg);
                border: 2px solid var(--accent);
                padding: 24px;
                border-radius: var(--radius);
                transition:
                    transform 0.3s ease,
                    box-shadow 0.3s ease;
                font-weight: bold;
                text-align: center;
            }

            /* .card:hover — lift effect */
            .card:hover {
                transform: translateY(-8px);
                box-shadow: 0 10px 20px rgba(20, 184, 166, 0.2);
            }

            /* .card[data-icon]::before — content using attr() */
            /* Hint: content: attr(data-icon) '  '; font-size: 2rem; display: block; */
            .card[data-icon]::before {
                content: attr(data-icon) "  ";
                font-size: 2rem;
                display: block;
                margin-bottom: 12px;
            }

            /* dark mode @media */
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0f172a;
                    --text: #f8fafc;
                    --card-bg: #1e293b;
                    --accent: #0f766e;
                }
            }
        </style>
    </head>
    <body>
        <h1>Kahlen's Skills</h1>
        <div class="grid">
            <div class="card" data-icon="🐍">Python — Data</div>
            <div class="card" data-icon="🤖">Machine Learning — Models</div>
            <div class="card" data-icon="📊">Data Analytics — Insights</div>
            <div class="card" data-icon="🌐">HTML5 — Structure</div>
            <div class="card" data-icon="🎨">CSS3 — Styling</div>
            <div class="card" data-icon="⚡">JavaScript — Behaviour</div>
        </div>
    </body>
</html>
