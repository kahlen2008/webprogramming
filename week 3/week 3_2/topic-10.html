<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            /* BASE STYLES - mobile-first (< 768px) */
            body {
                font-family: sans-serif;
                padding: 16px;
                background: #f0fdfa;
            }

            .grid {
                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            .card {
                background: white;
                border: 2px solid #14b8a6;
                border-radius: 10px;
                padding: 20px;
                font-size: 16px;
                color: #0f766e;
            }

            .breakpoint-label {
                font-size: 14px;
                background: #0f766e;
                color: white;
                padding: 6px 12px;
                border-radius: 4px;
                margin-bottom: 12px;
                display: inline-block;
            }

            /* TABLET ≥ 640px - 2 column grid */
            @media (min-width: 640px) {
                .grid {
                    flex-direction: row;
                    flex-wrap: wrap;
                }
                .card {
                    flex: 1;
                    min-width: 200px;
                }
            }

            /* DARK MODE */
            @media (prefers-color-scheme: dark) {
                body {
                    background: #051a0a;
                }
                .card {
                    background: #0b2017;
                    border-color: #14b8a6;
                    color: #d4edda;
                }
            }

            /* PRINT - hide decorative elements */
            @media print {
                .breakpoint-label {
                    display: none;
                }
                body {
                    background: white;
                }
            }
        </style>
    </head>
    <body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

        <div class="breakpoint-label">
            Resize the preview to see the grid change.
        </div>
        <div class="grid">
            <div class="card">Card One</div>
            <div class="card">Card Two</div>
            <div class="card">Card Three</div>
        </div>
    </body>
</html>
