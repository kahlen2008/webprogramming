<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            /* ::before adds a decorative leaf icon */
            h2::before {
                content: "🌿 ";
            }

            /* ::after adds a required asterisk to labels */
            .required::after {
                content: " *";
                color: #f43f5e;
                font-weight: bold;
            }

            /* ::before as a decorative underline bar */
            .underline-title {
                position: relative;
                display: inline-block;
                padding-bottom: 8px;
            }

            .underline-title::after {
                content: "";
                position: absolute;
                bottom: 0;
                left: 0;
                width: 100%;
                height: 3px;
                background: #0f766e;
                border-radius: 2px;
            }

            /* ::before as a quotation mark */
            blockquote {
                position: relative;
                padding-left: 36px;
                font-style: italic;
            }
            
            blockquote::before {
                content: '"';
                position: absolute;
                left: 0;
                top: -8px;
                font-size: 56px;
                color: #14b8a6;
                line-height: 1;
            }
        </style>
    </head>
    <body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

        <h2>CSS Pseudo-elements</h2>
        <p><label class="required">Email address</label></p>
        <p class="underline-title">Decorative Underline</p>
        <blockquote>
            CSS gives you superpowers - no JavaScript needed.
        </blockquote>
    </body>
</html>
