<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            /* flex-wrap: wrap - cards flow to new rows when narrow */
            .card-grid {
                display: flex;
                flex-wrap: wrap; /* items wrap to next row */
                gap: 16px;
                padding: 16px;
                background: #f0fdfa;
            }

            .card {
                flex: 1; /* grow to fill available space */
                min-width: 160px; /* but never smaller than 160px */
                background: #0f766e;
                color: white;
                padding: 20px;
                border-radius: 10px;
                text-align: center;
            }

            .card.featured {
                order: -1; /* move to front without changing HTML */
                flex: 2; /* twice as wide */
                background: #14b8a6;
            }

            /* flex-direction: column layout */
            .sidebar-layout {
                display: flex;
                gap: 16px;
                margin-top: 16px;
            }
            .sidebar {
                width: 180px;
                flex-shrink: 0;
                background: #ccfbf1;
                padding: 16px;
                border-radius: 10px;
                font-size: 14px;
            }
            .main {
                flex: 1;
                background: white;
                border: 2px solid #14b8a6;
                padding: 16px;
                border-radius: 10px;
            }
        </style>
    </head>
    <body>

        <a href="index.html" style="position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #64748b; font-weight: 600; transition: color 0.2s; z-index: 9999; background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px);" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Week
        </a>

        <div class="card-grid">
            <div class="card">A</div>
            <div class="card">B</div>
            <div class="card featured">FEATURED - order:-1, flex:2</div>
            <div class="card">C</div>
            <div class="card">D</div>
        </div>
        <div class="sidebar-layout">
            <aside class="sidebar">Sidebar (fixed 180px)</aside>
            <main class="main">
                Main content (flex:1 - fills remaining space)
            </main>
        </div>
    </body>
</html>
