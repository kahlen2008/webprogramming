<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Week 11_1 · HW2: Portfolio Gallery Component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg-body: #060911;
            --bg-card: rgba(15, 23, 42, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(56, 189, 248, 0.45);
            --blue: #38bdf8;
            --purple-light: #c084fc;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --text-dim: #64748b;
            --radius-card: 20px;
            --radius-sub: 12px;
            --radius-btn: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html {
            background-color: var(--bg-body);
            color-scheme: dark;
            min-height: 100%;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 90% 15%, rgba(168, 85, 247, 0.1) 0%, transparent 45%),
                radial-gradient(circle at 50% 90%, rgba(139, 92, 246, 0.08) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px 80px 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .topbar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: var(--radius-btn);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .back-link:hover {
            color: #ffffff;
            border-color: var(--blue);
            background: rgba(56, 189, 248, 0.12);
            transform: translateX(-2px);
        }

        .badge-pill {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--blue);
            white-space: nowrap;
        }

        .hero-banner {
            background: linear-gradient(135deg, rgba(88, 28, 135, 0.28) 0%, rgba(15, 23, 42, 0.95) 100%);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: var(--radius-card);
            padding: 44px 40px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--purple-light);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .hero-title {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.02em;
            line-height: 1.25;
        }

        .hero-url-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 6px;
        }

        .hero-url-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.88rem;
            font-family: 'Fira Code', monospace;
            transition: all 0.2s ease;
            width: fit-content;
        }

        .hero-url-pill:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(56, 189, 248, 0.4);
            color: #ffffff;
            transform: translateX(3px);
        }

        .hero-url-pill-live {
            border-color: rgba(56, 189, 248, 0.3);
            background: rgba(56, 189, 248, 0.08);
            color: var(--blue);
        }

        .pill-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 2px 7px;
            border-radius: 6px;
            background: rgba(56, 189, 248, 0.18);
            color: var(--blue);
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--blue);
            box-shadow: 0 0 8px var(--blue);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .btn-launch {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: #ffffff;
            padding: 14px 28px;
            border-radius: var(--radius-btn);
            font-weight: 700;
            font-size: 0.96rem;
            text-decoration: none;
            width: fit-content;
            box-shadow: 0 4px 18px rgba(168, 85, 247, 0.35);
            transition: all 0.25s ease;
            margin-top: 6px;
        }

        .btn-launch:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(168, 85, 247, 0.5);
            filter: brightness(1.1);
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.82rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <nav class="topbar" aria-label="Page Navigation">
            <a href="index.html" class="back-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Week 11_1 Overview
            </a>
            <div class="badge-pill">Week 11_1 · HW2</div>
        </nav>

        <header class="hero-banner">
            <span class="hero-tag">⭐ Homework 2 · Portfolio Gallery Component</span>
            <h1 class="hero-title">Projects | Kahlen Ong</h1>
            
            <div class="hero-url-row">
                <a href="https://kahlen2008.github.io/kahlensdigitalportfolio/projects.html" target="_blank" rel="noopener" class="hero-url-pill hero-url-pill-live">
                    <span class="pill-badge">
                        <span class="pulse-dot"></span>
                        Live Page
                    </span>
                    <span>https://kahlen2008.github.io/kahlensdigitalportfolio/projects.html</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                </a>
            </div>

            <a href="https://kahlen2008.github.io/kahlensdigitalportfolio/projects.html" target="_blank" rel="noopener" class="btn-launch">
                Open Projects Page
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
            </a>
        </header>
    </div>

    <footer>
        Web Programming Course · Week 11_1 · HW2: Portfolio Gallery
    </footer>

</body>
</html>
